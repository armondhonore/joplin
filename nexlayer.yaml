application:
  name: joplin
  pods:
  - name: app
    image: joplin/server:latest
    path: /
    servicePorts:
    - 22300
    vars:
      APP_PORT: "22300"
      APP_BASE_URL: "https://relaxed-weasel-joplin.cloud.nexlayer.ai"
      DB_CLIENT: pg
      POSTGRES_HOST: joplin-postgres.pod
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
    - name: joplin-db
      mountPath: /var/lib/postgresql/data
      size: 10Gi
